<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8" />
<title>Fila de atendimento — Busolan</title>
<style>
  body { font-family: system-ui, sans-serif; background: #0f1115; color: #e6e6e6; margin: 0; padding: 24px; }
  h1 { font-size: 20px; margin-bottom: 16px; }
  .card { background: #1a1d24; border: 1px solid #2a2e37; border-radius: 8px; padding: 16px; margin-bottom: 12px; }
  .card.alta { border-color: #b3452e; }
  .meta { font-size: 12px; color: #9099a8; margin-bottom: 8px; }
  .resumo { white-space: pre-wrap; margin-bottom: 12px; }
  button { background: #2f6fed; color: white; border: none; border-radius: 6px; padding: 8px 14px; cursor: pointer; }
  button:hover { background: #245ac2; }
  .empty { color: #9099a8; }
</style>
</head>
<body>
  <h1>Fila de atendimento</h1>
  <div id="queue" class="empty">Carregando...</div>

  <script>
    async function loadQueue() {
      const res = await fetch("/painel/api/queue");
      const items = await res.json();
      const el = document.getElementById("queue");

      if (items.length === 0) {
        el.className = "empty";
        el.textContent = "Nenhuma conversa esperando atendimento.";
        return;
      }

      el.className = "";
      el.innerHTML = items.map(function (item) {
        return (
          '<div class="card ' + (item.urgencia === "alta" ? "alta" : "") + '">' +
          '<div class="meta">' + item.whatsapp_number + " · " + item.motivo + " · " + item.urgencia + "</div>" +
          '<div class="resumo">' + (item.resumo || "") + "</div>" +
          '<button onclick="assumir(' + item.id + ')">Assumir conversa</button>' +
          "</div>"
        );
      }).join("");
    }

    async function assumir(id) {
      await fetch("/painel/api/conversations/" + id + "/assume", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ assumedBy: "vendedor" }),
      });
      loadQueue();
    }

    loadQueue();
    setInterval(loadQueue, 10000);
  </script>
</body>
</html>

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: busolan
      POSTGRES_PASSWORD: busolan
      POSTGRES_DB: busolan
    ports:
      - "5432:5432"
    volumes:
      - busolan_pg_data:/var/lib/postgresql/data

volumes:
  busolan_pg_data:
